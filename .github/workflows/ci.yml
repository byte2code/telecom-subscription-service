name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Build + Unit Tests
  # ─────────────────────────────────────────
  build:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run unit tests (skip integration test)
        run: mvn clean verify -Dtest='!TelecomIntegrationTest' --batch-mode --no-transfer-progress

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: target/custom-reports/

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 7

  # ─────────────────────────────────────────
  # JOB 2: Integration Tests (Testcontainers)
  # ─────────────────────────────────────────
  integration-test:
    name: Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Testcontainers integration test
        run: mvn test -Dtest=TelecomIntegrationTest --batch-mode --no-transfer-progress

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: target/custom-reports/

  # ─────────────────────────────────────────
  # JOB 3: Code Quality Gate
  # ─────────────────────────────────────────
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Verify no compilation warnings are errors
        run: mvn compile -Werror --batch-mode --no-transfer-progress || true

      - name: Check for TODO / FIXME in source
        run: |
          echo "Scanning for TODO/FIXME comments..."
          COUNT=$(grep -rn --include="*.java" -E "TODO|FIXME|HACK" src/main/ | wc -l)
          echo "Found $COUNT TODO/FIXME/HACK comments"
          if [ "$COUNT" -gt "10" ]; then
            echo "❌ Too many unresolved TODOs ($COUNT). Please clean up before merging."
            exit 1
          else
            echo "✅ TODO count is acceptable ($COUNT)"
          fi
